# Daily health check for the Builder Finder.
# Calls the public endpoint, which reads from Supabase. That keeps the
# free-tier project active (no 7-day auto-pause) and alerts by email if the
# finder is down. Read-only: no secrets, no writes.
name: Finder health check

on:
  schedule:
    - cron: "17 14 * * *"   # every day at 14:17 UTC (8:17 AM Central)
  workflow_dispatch:         # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check /public/builders returns companies
        run: |
          for attempt in 1 2 3; do
            body=$(curl -sS --max-time 60 https://barndo-agent-production.up.railway.app/public/builders) && \
            count=$(echo "$body" | python3 -c 'import sys,json; print(len(json.load(sys.stdin)["companies"]))') && \
            [ "$count" -gt 0 ] && { echo "OK: $count companies"; exit 0; }
            echo "Attempt $attempt failed; retrying in 60s"; sleep 60
          done
          echo "::error::Builder Finder endpoint is down or returned no companies"
          exit 1
